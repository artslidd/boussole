[package]
name = "boussole-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Boussole multiplayer server: match engine, axum/WebSocket transport, embeddable host API, tunnel helper"

[features]
# `cli` = what the standalone binary needs (log output); an app that embeds the server as a
# library can use `default-features = false` and keeps `tracing-subscriber` out of its build.
default = ["cli"]
cli = ["dep:tracing-subscriber"]

[[bin]]
name = "boussole-server"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
boussole-core.workspace = true
boussole-protocol.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json"] }
getrandom = "0.4"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
if-addrs = "0.15"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS is only for the bot example, which must be able to join through a wss:// tunnel.
# tokio-tungstenite is the same version as the one axum uses, so there is one tungstenite.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
