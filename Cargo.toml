[package]
name = "boussole"
version = "0.1.0"
edition = "2024"
description = "Boussole: guess the hidden French city from compass arrows to other cities"
publish = false

# The core (cities, geo, search, game) is pure std (tiny in-crate SplitMix64 PRNG); the
# dependencies below are for the Slint front end only.
[dependencies]
slint = "1.18"
ttf-parser = "0.25"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
png = "0.18.1"
