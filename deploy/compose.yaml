# Boussole server, optionally behind Caddy (automatic HTTPS). Run from the repository root:
#
#   LAN / testing, plain ws://<host>:7878/ws:
#     docker compose -f deploy/compose.yaml --profile lan up -d --build
#
#   Public host, wss://$BOUSSOLE_DOMAIN/ws with a Let's Encrypt certificate (needs a DNS
#   record for the domain and ports 80/443 reachable from the internet):
#     export BOUSSOLE_DOMAIN=boussole.example.org ACME_EMAIL=you@example.org
#     docker compose -f deploy/compose.yaml --profile tls up -d --build
#
# Podman works the same with `podman compose` / `podman-compose`. See docs/deploy.md.

name: boussole

x-server-env: &server-env
  BOUSSOLE_BIND: 0.0.0.0:7878
  BOUSSOLE_MAX_CONNECTIONS: ${BOUSSOLE_MAX_CONNECTIONS:-2000}
  BOUSSOLE_MAX_ROOMS: ${BOUSSOLE_MAX_ROOMS:-500}
  BOUSSOLE_MAX_CONNECTIONS_PER_IP: ${BOUSSOLE_MAX_CONNECTIONS_PER_IP:-20}
  RUST_LOG: ${RUST_LOG:-info}
  BOUSSOLE_LOG_FORMAT: ${BOUSSOLE_LOG_FORMAT:-text}

x-server: &server
  build:
    context: ..
    dockerfile: Dockerfile
  image: boussole-server:local
  restart: unless-stopped
  environment: *server-env
  healthcheck:
    test: ["CMD", "/usr/local/bin/boussole-server", "--healthcheck"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 5s
  # The server needs no privileges and writes nothing to disk.
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # Bounded resources: one runaway or attacked server must not take the host with it.
  pids_limit: 256
  mem_limit: 512m
  # Every connection is logged; without rotation a reconnect loop could fill the disk.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # `tls` profile: reachable only through Caddy, no published port.
  server:
    <<: *server
    profiles: [tls]
    expose: ["7878"]
    environment:
      <<: *server-env
      # Every peer is Caddy, so believe the client address it reports in X-Forwarded-For
      # (for the per-address connection limit). Only safe because nothing else can reach
      # this container: never set it on a server that is published directly.
      BOUSSOLE_TRUST_PROXY_HEADERS: "true"

  # `lan` profile: the same server, published directly (BOUSSOLE_PORT changes the host port).
  server-lan:
    <<: *server
    profiles: [lan]
    ports:
      - "${BOUSSOLE_PORT:-7878}:7878"

  caddy:
    image: caddy:2
    profiles: [tls]
    restart: unless-stopped
    # Caddy only has to bind ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Required for the tls profile. (No `:?` guard: Compose interpolates every service, even
      # those of inactive profiles, which would break `--profile lan`. An empty domain makes
      # Caddy refuse to start, see docs/deploy.md.)
      BOUSSOLE_DOMAIN: ${BOUSSOLE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  # Certificates and ACME account: keep this volume across restarts to avoid re-issuing.
  caddy_data:
  caddy_config:
